[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "tdxrs"
version = "0.7.0"
description = "TDX (通达信) market data parser — Rust implementation with Python bindings"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
keywords = ["tdx", "通达信", "stock", "market-data", "kline", "finance", "rust", "pyo3"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []
authors = [
    {name = "Chiang Tao", email = "chiangtao_fan@hotmail.com"}
]

[project.scripts]
tdxrs = "tdxrs.cli:main"

[project.optional-dependencies]
pandas = ["pandas>=1.0"]   # for *_dataframe() methods
dev = ["pytest", "pandas>=1.0"]

[project.urls]
repository = "https://github.com/jiangtaovan/tdxrs"

# === maturin config ===
[tool.maturin]
features = ["pyo3/extension-module"]
python-source = "python"              # Python package scaffolding (__init__.py etc.)
module-name = "tdxrs._internal"       # Native extension loaded as tdxrs._internal
# 排除不需要发布到 PyPI 的目录 (测试数据/示例/临时文档)
# 注意: benches/** 不能排除 —— Cargo.toml 显式声明 [[bench]] reader_bench，
# 缺文件则从 sdist 源码安装时 cargo manifest 解析直接报错 (与 Dockerfile
# A3 同类问题)；"TODO.md" 大小写须与实际文件一致
exclude = [
    "tests/**",
    "examples/**",
    "docs/**",
    "assets/**",
    ".github/**",
    "TODO.md",
    "Dockerfile",
    ".dockerignore",
]
